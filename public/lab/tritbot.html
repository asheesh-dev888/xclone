<script>/*ENGINE*/
const TB=(function(){
function norm(s){s=s.toLowerCase().replace(/[^a-z0-9\u0900-\u097f]+/g,' ');return ' '+s.split(' ').filter(Boolean).join(' ')+' ';}
function fnv(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0;}return h;}
function feats(s,NB,words){const ns=norm(s),t=[...ns],o=new Set();for(const n of [2,3,4])for(let i=0;i+n<=t.length;i++)o.add(fnv(n+t.slice(i,i+n).join(''))%NB);
  if(words){const w=ns.split(' ').filter(Boolean);for(const x of w)o.add(fnv('w'+x)%NB);for(let i=0;i+1<w.length;i++)o.add(fnv('b'+w[i]+' '+w[i+1])%NB);}return [...o].sort((a,b)=>a-b);}
function unpack(b64,n){const bin=atob(b64),t=new Int8Array(n);for(let i=0;i<n;i++){const c=(bin.charCodeAt(i>>2)>>((i&3)*2))&3;t[i]=c===1?1:c===2?-1:0;}return t;}
function load(M){
  const W1=unpack(M.W1,M.NB*M.H),W2=unpack(M.W2,M.H*M.C);
  // build sparse index lists per input row: which outputs get +x, which get -x (zeros skipped entirely)
  const rows=(W,R,Cc)=>{const P=[],N=[];for(let r=0;r<R;r++){const p=[],q=[];for(let c=0;c<Cc;c++){const w=W[r*Cc+c];if(w===1)p.push(c);else if(w===-1)q.push(c);}P.push(Int16Array.from(p));N.push(Int16Array.from(q));}return [P,N];};
  const [P1,N1]=rows(W1,M.NB,M.H),[P2,N2]=rows(W2,M.H,M.C);
  let zeros=0;for(const w of W1)if(!w)zeros++;for(const w of W2)if(!w)zeros++;
  function infer(text){
    const f=feats(text,M.NB,!!M.words),acc=new Float64Array(M.H);
    for(const i of f){for(const c of P1[i])acc[c]+=1;for(const c of N1[i])acc[c]-=1;}   // ternary layer 1: add/sub only (inputs are 0/1)
    const h=new Float64Array(M.H);for(let j=0;j<M.H;j++){const z=acc[j]*M.s1+M.b1[j];h[j]=z>0?z:0;}  // one per-layer scale
    const o=new Float64Array(M.C);
    for(let j=0;j<M.H;j++){const v=h[j];if(!v)continue;for(const c of P2[j])o[c]+=v;for(const c of N2[j])o[c]-=v;}  // layer 2: add/sub only
    let mx=-1e9;for(let c=0;c<M.C;c++){o[c]=o[c]*M.s2+M.b2[c];if(o[c]>mx)mx=o[c];}
    let s=0;const p=Array.from(o,x=>{const e=Math.exp(x-mx);s+=e;return e;});return {feats:f,probs:p.map(x=>x/s)};
  }

}

function calc(t){ // tiny safe calculator (recursive descent), supports words
  let s=t.toLowerCase().replace(/×|into|times|guna|गुणा/g,'*').replace(/÷|divided by|bhag|भाग/g,'/').replace(/plus|aur|jod|जोड़|और/g,'+').replace(/minus|ghatao|घटाओ/g,'-');
  const m=s.match(/[\d.()+\-*/%^ ]{3,}/g);if(!m)return null;const e=m.sort((a,b)=>b.length-a.length)[0].replace(/\s+/g,'');if(!/\d[^\d.]+\d|\(/.test(e))return null;
  let i=0;const peek=()=>e[i],num=()=>{if(peek()==='('){i++;const v=add();i++;return v;}if(peek()==='-'){i++;return -pw();}const st=i;while(/[\d.]/.test(e[i]||''))i++;if(st===i)throw 0;return parseFloat(e.slice(st,i));};
  const pw=()=>{let v=num();if(peek()==='^'){i++;v=Math.pow(v,pw());}return v;};
  const mul=()=>{let v=pw();while('*/%'.includes(peek())&&peek()){const o=e[i++],r=pw();v=o==='*'?v*r:o==='/'?v/r:v%r;}return v;};
  function add(){let v=mul();while(peek()==='+'||peek()==='-'){const o=e[i++],r=mul();v=o==='+'?v+r:v-r;}return v;}
  try{const v=add();if(i!==e.length||!isFinite(v))return null;return {e,v:Math.round(v*1e6)/1e6};}catch(_){return null;}
}
function add(cls,text,meta){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;if(meta){const x=document.createElement('div');x.className='meta';x.innerHTML=meta;d.appendChild(x);}log.appendChild(d);log.scrollTop=log.scrollHeight;}
function reply(t){
  const hi=/[\u0900-\u097f]/.test(t),{probs}=net.infer(t);
  const top=probs.map((p,i)=>[p,MODEL.intents[i]]).sort((a,b)=>b[0]-a[0]).slice(0,3);
  const c=calc(t);let intent=top[0][1],r;
  if(c&&(intent==='math'||top[0][0]<0.9)){intent='math';r=(hi?'उत्तर: ':'Answer: ')+c.e+' = '+c.v+' ✨';}
  else if(top[0][0]<THRESH||intent==='unknown'){intent='unknown';r=hi?'माफ़ कीजिए, मैं ठीक से समझ नहीं पाया 🙏 क्या आप दूसरे शब्दों में कह सकते हैं? (जैसे: चुटकुला, कहानी, 12*7)':"Hmm, I'm not sure I understood 🙏 Could you say it another way? Try: joke, story, motivation, 12*7, or 'what is ternary?'";}
  else{const R=MODEL.replies[intent];r=pick(hi&&R.hi.length?R.hi:R.en).replace('{TIME}',new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+', '+new Date().toLocaleDateString());}
  add('b',r,'<span>→ '+intent+'</span>'+top.map(([p,n])=>'<span>'+n+' '+(p*100).toFixed(1)+'%</span>').join(''));
}
function send(t){t=t.trim();if(!t)return;add('u',t);setTimeout(()=>reply(t),120);}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const q=document.getElementById('q');send(q.value);q.value='';};
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>send(b.textContent));
const S=MODEL.stats,info=document.getElementById('info');
info.innerHTML=`<b>Architecture</b>: char 2–4-gram + word uni/bigram hashing → ${MODEL.NB} buckets → ${MODEL.H} hidden (ReLU) → ${MODEL.C} intents · BitNet b1.58 QAT (absmean, round-clip, STE)<table>
<tr><td>Ternary weights</td><td>${net.total.toLocaleString()} (+${MODEL.H+MODEL.C} float biases, 2 scales)</td></tr>
<tr><td>Zeros (skipped)</td><td>${(100*net.zeros/net.total).toFixed(1)}%</td></tr>
<tr><td>Packed size</td><td>${(net.total/4/1024).toFixed(1)} KB (2 bits/weight) vs ${S.float32_kb.toFixed(1)} KB float32 → ${(S.float32_kb/(net.total/4/1024)).toFixed(1)}× smaller</td></tr>
<tr><td>Layer scales</td><td>γ1=${MODEL.s1.toFixed(4)}, γ2=${MODEL.s2.toFixed(4)}</td></tr>
<tr><td>Held-out acc</td><td>float ${(S.float32_acc*100).toFixed(1)}% · ternary QAT ${(S.ternary_acc*100).toFixed(1)}% (n=${S.n_test} unseen phrases)</td></tr>
<tr><td>Gibberish rejected</td><td>${(S.gib_reject*100).toFixed(0)}% of ${S.n_nonsense} nonsense/off-topic strings · T=${MODEL.T.toFixed(2)}, threshold ${MODEL.thr}</td></tr>
<tr><td>Weight math</td><td>add / subtract only; top-3 intent probabilities shown under every reply</td></tr></table>`;
document.getElementById('ib').onclick=()=>info.classList.toggle('on');
add('b','Namaste! 🙏 I\'m Trit Bot by Naad. Talk to me in English, Hinglish या हिन्दी. My brain is made only of −1, 0 and +1!');
